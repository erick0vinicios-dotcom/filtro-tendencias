[general]
log_level = "INFO"
raw_dir = "data/raw"

[unify.shared_hosts]
"github.com" = 2
"gitlab.com" = 2
"codeberg.org" = 2
"huggingface.co" = 2
"npmjs.com" = 2
"pypi.org" = 2
"crates.io" = 2
"apps.apple.com" = 3
"chromewebstore.google.com" = 3
"marketplace.visualstudio.com" = 2
"medium.com" = 1
"x.com" = 1
"twitter.com" = 1
"youtube.com" = 1

[sources.hackernews]
enabled = true
max_items = 200
workers = 10
lookback_hours = 72
min_points = 3
min_age_hours = 2.0

[sources.producthunt]
enabled = true
order = "VOTES"
featured_only = true
lookback_hours = 48
page_size = 20
max_pages = 5
min_remaining_quota = 500
min_age_hours = 2.0

[sources.github]
enabled = true
lookback_days = 14
min_stars = 20
per_page = 50
min_age_hours = 6.0
topics = [
  "ai",
  "llm",
  "ai-agents",
  "generative-ai",
  "mcp",
  "automation",
  "rag",
  "saas",
]
